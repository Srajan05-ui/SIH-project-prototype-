name: AirPrice India Smart Scraper

on:
  schedule:
    # Scheduled 30 minutes early to account for GitHub free-tier cron delays
    # Target 04:00 IST -> Trigger 03:30 IST = 22:00 UTC
    # Target 12:00 IST -> Trigger 11:30 IST = 06:00 UTC
    # Target 19:00 IST -> Trigger 18:30 IST = 13:00 UTC
    # Target 20:00 IST -> Trigger 19:30 IST = 14:00 UTC
    # Target 23:00 IST -> Trigger 22:30 IST = 17:00 UTC
    - cron: '0 22,6,13,14,17 * * *'
  
  # Allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  scrape_and_process:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Mock Airline API (Background)
      run: |
        # Start the local mock API on port 8000 so Tier 0 and Tier 2 can hit it
        uvicorn api:app --port 8000 &
        # Give it a few seconds to start up
        sleep 5

    - name: Run Collector Tier 1 (Google Flights)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python collector_tier1.py

    - name: Run Collector Tier 0 (DGCA Mock)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python collector_tier0_dgca.py

    - name: Run Collector Tier 2 (Airline Direct Mock)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python collector_tier2_airline.py

    - name: Run Stage 3 (Cleaning)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python cleaning.py

    - name: Run Stage 4 (Index Calculation)
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python index_calc.py
